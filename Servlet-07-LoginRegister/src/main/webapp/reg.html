<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register</title>

<style>
body {
	margin: 0;
	font-family: Arial, Helvetica, sans-serif;
	height: 100vh;
	display: flex;
	justify-content: center;
	align-items: center;
	background: linear-gradient(135deg, #667eea, #764ba2);
}

.container {
	background: white;
	padding: 40px;
	border-radius: 15px;
	box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
	width: 320px;
	text-align: center;
	transition: 0.3s;
}

.container:hover {
	transform: scale(1.02);
}

h2 {
	margin-bottom: 20px;
	color: #333;
}

.input-box {
	margin-bottom: 15px;
	text-align: left;
}

input {
	width: 100%;
	padding: 10px;
	border-radius: 8px;
	border: 1px solid #ccc;
	outline: none;
	transition: 0.3s;
}

input:focus {
	border-color: #667eea;
	box-shadow: 0 0 8px rgba(102, 126, 234, 0.4);
}

button {
	width: 100%;
	padding: 12px;
	border: none;
	border-radius: 8px;
	background: #667eea;
	color: white;
	font-size: 16px;
	cursor: pointer;
	transition: 0.3s;
}

button:hover {
	background: #764ba2;
	transform: translateY(-2px);
	box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
}
</style>
</head>

<body>

	<div class="container">

		<h2>Registration Form</h2>

		<form action="reg" method="post">

			<div class="input-box">
				<label>First Name</label> <input type="text" id="fname" name="fname"
					required>
			</div>

			<div class="input-box">
				<label>Last Name</label> <input type="text" id="lname" name="lname"
					required>
			</div>

			<div class="input-box">
				<label>User Name</label> <input type="text" id="uname" name="uname"
					required>
			</div>

			<div class="input-box">
				<label>Password</label> <input type="password" id="pass" name="pass"
					required>
			</div>

			<button type="submit">Register</button>

		</form>

	</div>

</body>

</html>
