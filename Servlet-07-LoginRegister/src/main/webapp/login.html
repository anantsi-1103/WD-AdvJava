<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login Form</title>

<style>

body{
    margin:0;
    font-family: Arial, Helvetica, sans-serif;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background: linear-gradient(135deg, #667eea, #764ba2);
}

.container{
    background:white;
    padding:40px;
    border-radius:15px;
    box-shadow:0 10px 25px rgba(0,0,0,0.2);
    width:300px;
    text-align:center;
    transition:0.3s;
}

.container:hover{
    transform:scale(1.02);
}

h1{
    margin-bottom:25px;
    color:#333;
}

.input-box{
    margin-bottom:15px;
    text-align:left;
}

input{
    width:100%;
    padding:10px;
    border-radius:8px;
    border:1px solid #ccc;
    outline:none;
    transition:0.3s;
}

input:focus{
    border-color:#667eea;
    box-shadow:0 0 8px rgba(102,126,234,0.4);
}

button{
    width:100%;
    padding:12px;
    border:none;
    border-radius:8px;
    background:#667eea;
    color:white;
    font-size:16px;
    cursor:pointer;
    transition:0.3s;
}

button:hover{
    background:#764ba2;
    transform:translateY(-2px);
    box-shadow:0 5px 15px rgba(0,0,0,0.2);
}

</style>
</head>

<body>

<div class="container">
    <h1>Login</h1>

    <form action="login" method="post">

        <div class="input-box">
            <label>Username :</label>
            <input type="text" id="uname" name="uname" required>
        </div>

        <div class="input-box">
            <label>Password :</label>
            <input type="password" id="pword" name="pass" required>
        </div>

        <button type="submit">Login</button>

    </form>
</div>

</body>
</html>
