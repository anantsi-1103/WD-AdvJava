<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Add Book</title>
</head>
<body>
	<h2>Add new Book</h2>

	<form action="add" method="post">
		<label for="bid">Book ID</label> <input type="number" name="id"
			id="bid"> <br>
		<br> <label for="bname">Book Name</label> <input type="text"
			name="name" id="bname"> <br>
		<br> <label for="bPrice">Book Price</label> <input type="number"
			name="price" id="bPrice"> <br> <br> <label
			for="bauthor">Book Author</label> <input type="text" name="author"
			id="bauthor"> <br>
		<br> <input type="submit" value="submit"> <input
			type="reset" value="reset">
	</form>
</body>
</html>
